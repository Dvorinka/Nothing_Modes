<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing Modes — Feature Library</title>
<meta name="description" content="Community-made modes and glyph designs for Nothing Modes. Every item is reviewed before publication.">
<meta name="theme-color" content="#000000">
<script src="https://rybbit.tdvorak.dev/api/script.js" data-site-id="fe8285816716" defer></script>
<style>
  @font-face { font-family:"Doto"; src:url("fonts/doto.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Geist Mono"; src:url("fonts/geist_mono_regular.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Geist Sans"; src:url("fonts/geist_sans_regular.ttf") format("truetype"); font-display:swap; }
  :root { --bg:#000; --panel:#161616; --panel2:#0f0f0f; --line:#262626; --fg:#fafaf8;
    --dim:#8a8a8a; --red:#D71921; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.55 "Geist Sans",system-ui,sans-serif; min-height:100vh; }
  code, .mono { font-family:"Geist Mono",ui-monospace,Menlo,monospace; }
  a { color:inherit; }

  .nav { display:flex; justify-content:space-between; align-items:center; padding:1.1rem 1.4rem;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(0,0,0,.85); backdrop-filter:blur(8px); z-index:10; }
  .wordmark { font-family:"Geist Mono",monospace; font-weight:600; letter-spacing:.18em; text-decoration:none; font-size:.85rem; }
  .wordmark::before { content:""; display:inline-block; width:.55rem; height:.55rem; background:var(--red);
    border-radius:50%; margin-right:.6rem; }
  .nav a.back { color:var(--dim); text-decoration:none; font-family:"Geist Mono",monospace; font-size:.75rem; letter-spacing:.1em; }
  .nav a.back:hover { color:var(--fg); }

  main { max-width:60rem; margin:0 auto; padding:2.4rem 1.25rem 5rem; }
  h1 { font-family:"Doto",monospace; font-size:clamp(1.8rem,6vw,3rem); letter-spacing:.06em; font-weight:400; }
  .lbl { color:var(--dim); font-size:.7rem; text-transform:uppercase; letter-spacing:.14em; font-family:"Geist Mono",monospace; }
  .lbl .dot { display:inline-block; width:.5rem; height:.5rem; background:var(--red); border-radius:50%; margin-right:.5rem; }
  .sub { color:var(--dim); margin:.8rem 0 2rem; max-width:36rem; }

  .tabs { display:flex; gap:.5rem; margin-bottom:1.2rem; }
  .tab { background:var(--panel); border:1px solid var(--line); color:var(--dim); padding:.6rem 1.2rem;
    border-radius:.5rem; font:inherit; cursor:pointer; font-size:.82rem; letter-spacing:.1em; text-transform:uppercase; }
  .tab.on { border-color:var(--red); color:var(--fg); }
  .tab:hover { color:var(--fg); }

  .toolbar { display:flex; gap:.6rem; margin-bottom:1.2rem; flex-wrap:wrap; align-items:center; }
  .toolbar input, .toolbar select { flex:1; min-width:160px; background:var(--panel); border:1px solid var(--line);
    color:var(--fg); padding:.6rem .9rem; border-radius:.5rem; font:inherit; }
  .toolbar input:focus, .toolbar select:focus { outline:none; border-color:#444; }
  .toolbar select { appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position:calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size:6px 6px, 6px 6px; background-repeat:no-repeat; padding-right:2rem; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--dim); padding:.55rem 1rem;
    border-radius:.5rem; font:inherit; cursor:pointer; font-size:.82rem; text-decoration:none; }
  .chip.on { border-color:var(--red); color:var(--fg); }
  .chip:hover { color:var(--fg); }
  .caps { display:flex; gap:.5rem; flex-wrap:wrap; margin:.8rem 0 1.2rem; }

  .section-head { display:flex; justify-content:space-between; align-items:baseline; margin:1.4rem 0 .6rem; }
  .section-title { font-family:"Doto",monospace; font-size:1.1rem; letter-spacing:.12em; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(18rem, 1fr)); gap:1rem; }
  .item { background:var(--panel); border:1px solid var(--line); border-radius:.7rem;
    padding:1rem; display:flex; gap:1rem; align-items:flex-start; cursor:pointer; transition:border-color .15s; }
  .item:hover { border-color:#3a3a3a; }
  .item .thumb { flex-shrink:0; width:72px; height:72px; background:var(--panel2); border:1px solid var(--line);
    border-radius:.5rem; display:grid; place-items:center; overflow:hidden; }
  .item .thumb canvas { display:block; width:100%; height:100%; }
  .item .icon { width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
    border:1px solid rgba(255,255,255,0.1); color:#fff; }
  .item .icon .material-symbols-outlined { font-size:22px; }
  .item .body { flex:1; min-width:0; }
  .item h2 { font-size:1.05rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .by { color:var(--dim); font-size:.78rem; margin-top:.1rem; }
  .by a { color:var(--dim); }
  .desc { color:#bbb; font-size:.85rem; margin-top:.35rem; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.6rem; align-items:center; }
  .tag { background:var(--panel2); border:1px solid var(--line); border-radius:.4rem;
    padding:.18rem .55rem; font-size:.68rem; color:var(--dim); font-family:"Geist Mono",monospace; }
  .dl { margin-left:auto; background:var(--red); color:#fff; border:0; padding:.5rem 1.1rem;
    border-radius:.5rem; font:inherit; font-weight:600; cursor:pointer; font-size:.8rem; letter-spacing:.05em; }
  .dl:active { opacity:.85; }

  .empty { color:var(--dim); text-align:center; padding:4rem 0; font-family:"Geist Mono",monospace; grid-column:1 / -1; }
  #status { color:var(--dim); font-size:.85rem; min-height:1.4em; margin-bottom:1rem; }

  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  .submit { color:var(--dim); text-decoration:none; font-family:"Geist Mono",monospace; font-size:.8rem; letter-spacing:.1em; border:1px solid var(--line); padding:.5rem 1rem; border-radius:.5rem; }
  .submit:hover { color:var(--fg); border-color:#444; }

  /* modal */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:50; align-items:center; justify-content:center; padding:1rem; }
  .modal.open { display:flex; }
  .modal-card { background:var(--panel); border:1px solid var(--line); border-radius:.8rem; max-width:26rem; width:100%; max-height:90vh; overflow:auto; padding:1.2rem; }
  .modal-head { display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; margin-bottom:1rem; }
  .modal h2 { font-size:1.2rem; }
  .modal canvas { width:100%; max-width:320px; display:block; margin:0 auto 1rem; background:#000; border:1px solid var(--line); border-radius:.5rem; }
  .modal .controls { display:flex; justify-content:center; gap:.6rem; margin-bottom:1rem; }
  .close { background:none; border:1px solid var(--line); color:var(--dim); padding:.4rem .8rem; border-radius:.4rem; cursor:pointer; font:inherit; }
  .close:hover { color:var(--fg); }
  .modal-template-head { display:flex; align-items:center; gap:1rem; margin-bottom:1.2rem; }
  .modal-icon-wrap { width:72px; height:72px; border-radius:50%; display:grid; place-items:center; border:1px solid rgba(255,255,255,0.1); color:#fff; }
  .modal-icon-wrap .material-symbols-outlined { font-size:36px; }
  .modal-detail { background:var(--panel2); border:1px solid var(--line); border-radius:.5rem; padding:1rem; }
  .modal-detail .section { margin-bottom:.8rem; }
  .modal-detail .section:last-child { margin-bottom:0; }
  .modal-detail .section-title { font-family:"Geist Mono",monospace; font-size:.65rem; color:var(--dim); text-transform:uppercase; letter-spacing:.12em; margin-bottom:.35rem; }
  .modal-detail .section-body { color:var(--fg); font-size:.9rem; line-height:1.45; }
  .modal-detail .item { display:flex; gap:.5rem; align-items:flex-start; margin:.35rem 0; }
  .modal-detail .item::before { content:""; display:inline-block; width:.35rem; height:.35rem; background:var(--red); border-radius:50%; margin-top:.45rem; flex-shrink:0; }
  .modal-detail .empty-list { color:var(--dim); font-size:.85rem; }

  /* Nav right cluster + toggles */
  .nav-right { display:flex; align-items:center; gap:.9rem; }
  .nav-toggles { display:inline-flex; align-items:center; gap:.5rem; }
  .tgl { font-family:"Geist Mono",monospace; font-size:11px; letter-spacing:.1em;
    padding:7px 12px; background:transparent; color:var(--dim); border:1px solid var(--line);
    border-radius:999px; cursor:pointer; transition:color .12s, border-color .12s; }
  .tgl:hover { color:var(--fg); border-color:#444; }
  .tgl[aria-pressed="true"] { color:var(--fg); border-color:var(--red); }

  /* ===== Theme: light (Nothing palette, light variant) ===== */
  :root[data-theme="light"] {
    --bg:#F4F4F2; --panel:#FFFFFF; --panel2:#FAFAFA; --line:#E2E2DE; --fg:#1A1A1A;
    --dim:#6a6a6a; --red:#D71921;
  }
  :root[data-theme="light"] .nav { background:rgba(244,244,242,.88); }
  :root[data-theme="light"] .item .icon,
  :root[data-theme="light"] .modal-icon-wrap { border-color:rgba(0,0,0,0.08); }
  :root[data-theme="light"] .modal canvas { background:#fff; }

  /* ===== Style: normal — premium SaaS (indigo accent, neutral canvas) =====
     Remaps the shared variables so the whole page restyles without touching
     the Nothing look. Matches the app's CLASSIC palette. */
  :root[data-style="normal"] {
    --bg:#121316; --panel:#1A1C21; --panel2:#22252B; --line:#2D3038; --fg:#E6E6E4;
    --dim:#A8ABBA; --red:#8E97E8;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px rgba(0,0,0,.32);
  }
  :root[data-style="normal"][data-theme="light"] {
    --bg:#FAFAF8; --panel:#FFFFFF; --panel2:#F0F0EE; --line:#D8D8D4; --fg:#1A1C21;
    --dim:#5B6071; --red:#3F4DBF;
    --shadow-sm:0 1px 2px rgba(26,23,20,.06); --shadow-md:0 8px 24px rgba(26,23,20,.08);
  }
  :root[data-style="normal"] .nav { background:rgba(18,19,22,.88); backdrop-filter:blur(10px); }
  :root[data-style="normal"][data-theme="light"] .nav { background:rgba(250,250,248,.88); }
  /* Wordmark dot becomes a soft accent disc, not a hard Nothing-red square */
  :root[data-style="normal"] .wordmark { font-family:"Geist Sans",sans-serif; font-weight:600; letter-spacing:-.01em; }
  :root[data-style="normal"] .wordmark::before { border-radius:50%; }
  :root[data-style="normal"] .back { font-family:"Geist Sans",sans-serif; letter-spacing:0; text-transform:none; font-size:.85rem; }
  /* Hero title + section titles: Geist Sans, normal case */
  :root[data-style="normal"] h1 { font-family:"Geist Sans",sans-serif; font-weight:700; letter-spacing:-.025em; }
  :root[data-style="normal"] .section-title { font-family:"Geist Sans",sans-serif; font-weight:600; letter-spacing:0; text-transform:none; font-size:1rem; }
  /* Eyebrow labels: muted, not red-dot prefixed */
  :root[data-style="normal"] .lbl { font-family:"Geist Sans",sans-serif; letter-spacing:.04em; }
  :root[data-style="normal"] .lbl .dot { background:var(--red); }
  /* Tabs/chips: rounded, soft accent border */
  :root[data-style="normal"] .tab,
  :root[data-style="normal"] .chip { border-radius:10px; text-transform:none; letter-spacing:0; font-size:.85rem; }
  :root[data-style="normal"] .tab.on,
  :root[data-style="normal"] .chip.on { border-color:var(--red); }
  /* Items: rounded cards with soft shadow */
  :root[data-style="normal"] .item { border-radius:14px; box-shadow:var(--shadow-sm); }
  :root[data-style="normal"] .item:hover { border-color:var(--line); box-shadow:var(--shadow-md); }
  :root[data-style="normal"] .thumb { border-radius:10px; }
  :root[data-style="normal"] .item .icon { border-radius:50%; }
  /* Download button: solid accent, rounded */
  :root[data-style="normal"] .dl { border-radius:10px; letter-spacing:0; }
  /* Modal: rounded, soft shadow */
  :root[data-style="normal"] .modal-card { border-radius:16px; box-shadow:var(--shadow-md); }
  :root[data-style="normal"] .modal canvas { border-radius:10px; }
  :root[data-style="normal"] .modal-detail .item::before { background:var(--red); border-radius:50%; }
  /* Inputs: rounded, neutral */
  :root[data-style="normal"] .toolbar input,
  :root[data-style="normal"] .toolbar select { border-radius:10px; }
  :root[data-style="normal"] .submit { border-radius:10px; font-family:"Geist Sans",sans-serif; letter-spacing:0; text-transform:none; font-size:.85rem; }
</style>
</head>
<body>

<header class="nav">
  <a class="wordmark" href="/">NOTHING_MODES</a>
  <div class="nav-right">
    <a class="back" href="/">← BACK TO SITE</a>
    <span class="nav-toggles">
      <button class="tgl" id="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle light theme" title="Dark / light">◐</button>
      <button class="tgl" id="style-toggle" type="button" aria-pressed="false" aria-label="Toggle interface style" title="Nothing style / normal style">DOTS</button>
    </span>
  </div>
</header>

<main>
  <p class="lbl"><span class="dot"></span>COMMUNITY FEATURE LIBRARY</p>
  <h1>FEATURE LIBRARY</h1>
  <p class="sub">Modes and Glyph designs made by users, reviewed before publication. Tap an item to preview; click the download button to save the JSON for import in the app.</p>

  <div class="topbar">
    <div class="tabs">
      <button class="tab on" data-type="template">MODES</button>
      <button class="tab" data-type="glyph">GLYPHS</button>
    </div>
    <a class="submit" id="adminChip" href="/admin" style="display:none; color:var(--red); border-color:rgba(215,25,33,.4)">ADMIN</a>
    <a class="submit" href="/submit">SUBMIT A FEATURE</a>
  </div>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Search title, description, author…">
    <select id="sort">
      <option value="newest">Newest first</option>
      <option value="download">Most downloaded</option>
      <option value="alpha">A-Z</option>
    </select>
  </div>
  <div id="caps" class="caps"></div>
  <div id="status">Loading…</div>
  <div id="list" class="grid"></div>
</main>

<div id="modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-card" id="modalCard">
    <div class="modal-head">
      <div>
        <h2 id="modalTitle">Preview</h2>
        <div id="modalMeta" class="by"></div>
      </div>
      <button class="close" onclick="closeModal()">✕</button>
    </div>

    <canvas id="modalCanvas" width="320" height="320"></canvas>

    <div id="modalTemplateBody" style="display:none">
      <div class="modal-template-head">
        <div class="modal-icon-wrap" id="modalIconWrap"></div>
        <div>
          <div class="lbl" id="modalTemplateType"></div>
          <div id="modalTemplateAuthor" class="by"></div>
        </div>
      </div>
      <div id="modalTemplateDetail" class="modal-detail"></div>
    </div>

    <div class="controls" id="modalControls">
      <button class="chip" id="playBtn" onclick="togglePlay()">PAUSE</button>
      <button class="dl" id="modalDl" data-id="" onclick="download(this.dataset.id, this.dataset.name)">DOWNLOAD</button>
    </div>
    <p class="desc" id="modalDesc"></p>
  </div>
</div>

<script>
// ---- Theme (dark/light) and style (nothing/normal) toggles ----
// Mirrors landing/script.js so the preference persists across pages.
(function () {
  const root = document.documentElement;
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  const applyTheme = (t) => {
    root.setAttribute("data-theme", t);
    if (metaTheme) metaTheme.setAttribute("content", t === "light" ? "#F4F4F2" : "#000000");
    const btn = document.getElementById("theme-toggle");
    if (btn) btn.setAttribute("aria-pressed", String(t === "light"));
  };
  const applyStyle = (s) => {
    root.setAttribute("data-style", s);
    const btn = document.getElementById("style-toggle");
    if (btn) {
      btn.setAttribute("aria-pressed", String(s === "normal"));
      btn.textContent = s === "normal" ? "PLAIN" : "DOTS";
    }
  };
  applyTheme(
    localStorage.getItem("nm-theme") ||
      (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
  );
  applyStyle(localStorage.getItem("nm-style") || "nothing");
  const themeBtn = document.getElementById("theme-toggle");
  if (themeBtn) themeBtn.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    localStorage.setItem("nm-theme", next);
    applyTheme(next);
  });
  const styleBtn = document.getElementById("style-toggle");
  if (styleBtn) styleBtn.addEventListener("click", () => {
    const next = root.getAttribute("data-style") === "normal" ? "nothing" : "normal";
    localStorage.setItem("nm-style", next);
    applyStyle(next);
  });
})();

const qEl = document.getElementById('q');
const sortEl = document.getElementById('sort');
const capsEl = document.getElementById('caps');
let type = 'template';
let sort = 'newest';
let selectedCaps = new Set();
let allItems = [];
let items = [];
let debounce;
let modalTimer = null;
let modalItem = null;
let playing = true;
const adminToken = localStorage.getItem('crash_admin_token') || '';

const ROWS_25 = [7,11,15,17,19,21,21,23,23,25,25,25,25,25,25,25,23,23,21,21,19,17,15,11,7];
const ROWS_13 = [5,9,11,11,13,13,13,13,13,11,11,9,5];

let iconMap = new Map();
let iconFallback = 'star';

async function loadIcons() {
  try {
    const res = await fetch('/icons.json');
    const data = await res.json();
    iconFallback = data.fallback || 'star';
    for (const i of data.icons) iconMap.set(i.name, i.symbol);
    const names = [...new Set(data.icons.map(i => i.symbol))].sort().join(',');
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=${encodeURIComponent(names)}&display=block`;
    document.head.appendChild(link);
    await document.fonts.load('24px "Material Symbols Outlined"');
  } catch (e) {
    // Keep fallback star. Real icons will not render without the icon map.
  }
}

qEl.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(load, 250); });
sortEl.addEventListener('change', () => { sort = sortEl.value; load(); });

document.querySelectorAll('.tab').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    type = b.dataset.type;
    selectedCaps.clear();
    load();
  }));

async function load() {
  document.getElementById('status').textContent = 'Loading…';
  const p = new URLSearchParams();
  p.set('type', type);
  p.set('preview', '1');
  if (qEl.value.trim()) p.set('q', qEl.value.trim());
  p.set('sort', sort);
  if (selectedCaps.size) p.set('caps', [...selectedCaps].join(','));
  const res = await fetch('/api/library?' + p);
  const data = await res.json();
  allItems = data.items || [];
  items = allItems;
  document.getElementById('status').textContent = '';
  renderCaps();
  render();
}

function renderCaps() {
  const allCaps = new Set();
  allItems.forEach(it => (it.capabilities || []).forEach(c => allCaps.add(c)));
  capsEl.innerHTML = '';
  if (allCaps.size === 0) return;
  allCaps.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (selectedCaps.has(c) ? ' on' : '');
    b.textContent = c.replace(/_/g, ' ');
    b.addEventListener('click', () => {
      selectedCaps.has(c) ? selectedCaps.delete(c) : selectedCaps.add(c);
      load();
    });
    capsEl.appendChild(b);
  });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function ago(ts) {
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="empty">NOTHING HERE YET — BE THE FIRST</div>';
    return;
  }
  for (const it of items) {
    const el = document.createElement('div');
    el.className = 'item';
    el.addEventListener('click', (e) => {
      if (!e.target.closest('.dl')) openModal(it);
    });
    const gh = it.github
      ? (it.github.startsWith('http') ? it.github : 'https://github.com/' + it.github.replace(/^@/, ''))
      : '';

    let thumb = '';
    if (type === 'glyph' && it.preview?.firstFrame) {
      thumb = `<div class="thumb"><canvas width="72" height="72" data-preview="${esc(JSON.stringify(it.preview))}"></canvas></div>`;
    } else if (type === 'template' && it.preview) {
      const bg = it.preview.iconBackground === 'transparent' ? 'var(--panel2)' : esc(it.preview.iconBackground);
      const symbol = iconMap.get(it.preview.icon) || iconMap.get(iconFallback) || 'star';
      thumb = `<div class="thumb" style="background:${bg}"><div class="icon" style="background:${bg}"><span class="material-symbols-outlined">${esc(symbol)}</span></div></div>`;
    } else {
      thumb = `<div class="thumb"></div>`;
    }

    el.innerHTML = `
      ${thumb}
      <div class="body">
        <h2>${esc(it.title)}</h2>
        <div class="by">by <b>@${esc(it.handle)}</b>${gh ? ` · <a href="${esc(gh)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(gh.replace(/^https:\/\/(www\.)?github\.com\//, ''))}</a>` : ''} · ${ago(it.created_at)}</div>
        ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ''}
        <div class="meta">
          ${it.summary ? `<span class="tag">${esc(it.summary)}</span>` : ''}
          ${(it.capabilities || []).map(c => `<span class="tag">${esc(c)}</span>`).join('')}
          <span class="tag">${it.downloads} downloads</span>
          ${adminToken ? `<button class="tag" style="color:var(--red);border-color:rgba(215,25,33,.4)" data-id="${esc(it.id)}" onclick="event.stopPropagation()">DELETE</button>` : ''}
          <button class="dl" data-id="${esc(it.id)}" data-name="${esc(it.title)}" onclick="event.stopPropagation()">DOWNLOAD</button>
        </div>
      </div>`;
    list.appendChild(el);
  }
  list.querySelectorAll('.dl').forEach(b =>
    b.addEventListener('click', () => download(b.dataset.id, b.dataset.name)));
  list.querySelectorAll('.meta .tag[data-id]').forEach(b =>
    b.addEventListener('click', () => deleteItem(b.dataset.id)));
  list.querySelectorAll('canvas[data-preview]').forEach(c => drawGlyphThumb(c, JSON.parse(c.dataset.preview)));
}

async function deleteItem(id) {
  if (!confirm('Delete this item? This cannot be undone.')) return;
  const res = await fetch('/api/delete', {
    method: 'POST',
    headers: {
      Authorization: 'Bearer ' + adminToken,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ type: 'submission', id }),
  });
  if (!res.ok) { alert('Failed: ' + await res.text()); return; }
  load();
}

function fillCell(ctx, x, y, s, r) {
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(x, y, s, s, r);
    ctx.fill();
  } else {
    ctx.fillRect(x, y, s, s);
  }
}

function drawGlyphThumb(canvas, preview) {
  const ctx = canvas.getContext('2d');
  const size = preview.size || 25;
  const p = Array.isArray(preview.firstFrame) ? preview.firstFrame : [];
  const rows = size === 13 ? ROWS_13 : ROWS_25;
  drawGlyphFrame(ctx, size, rows, p, canvas.width, canvas.height);
}

function drawGlyphFrame(ctx, size, rows, pixels, w, h) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  const cell = w / size;
  const inset = cell * 0.16;
  const inner = cell - inset * 2;
  const radius = Math.max(1, cell * 0.08);
  let idx = 0;
  for (let r = 0; r < size; r++) {
    const w = rows[r] || 0;
    const start = (size - w) >> 1;
    for (let c = 0; c < size; c++) {
      const x = c * cell + inset;
      const y = r * cell + inset;
      if (c >= start && c < start + w) {
        const v = Number(pixels[idx++] ?? 0);
        if (v > 0) {
          const a = v / 255;
          ctx.fillStyle = `rgba(215,25,33,${a})`;
          fillCell(ctx, x, y, inner, radius);
        } else {
          ctx.fillStyle = 'rgba(255,255,255,0.06)';
          fillCell(ctx, x, y, inner, radius);
        }
      }
    }
  }
}

async function download(id, name) {
  const res = await fetch('/api/item?id=' + encodeURIComponent(id));
  if (!res.ok) { alert('Download failed'); return; }
  const { item } = await res.json();
  const blob = new Blob([JSON.stringify(item.payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (name || 'nothing-modes').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function openModal(it) {
  modalItem = it;
  document.getElementById('modalTitle').textContent = esc(it.title);
  document.getElementById('modalMeta').innerHTML = `by @${esc(it.handle)} · ${esc(it.summary || '')}`;
  document.getElementById('modalDesc').textContent = it.description || '';
  document.getElementById('modalDl').dataset.id = it.id;
  document.getElementById('modalDl').dataset.name = it.title;
  document.getElementById('modal').classList.add('open');

  if (it.type === 'glyph') {
    document.getElementById('modalCanvas').style.display = '';
    document.getElementById('modalTemplateBody').style.display = 'none';
    document.getElementById('playBtn').style.display = '';
    playing = true;
    document.getElementById('playBtn').textContent = 'PAUSE';
    playModal();
  } else {
    document.getElementById('modalCanvas').style.display = 'none';
    document.getElementById('modalTemplateBody').style.display = '';
    document.getElementById('playBtn').style.display = 'none';
    if (!it._payload) {
      const res = await fetch('/api/preview?id=' + encodeURIComponent(it.id));
      const data = await res.json().catch(() => ({}));
      it._payload = data.item?.payload;
    }
    renderTemplateModal(it, it._payload);
  }
}

async function playModal() {
  if (!modalItem) return;
  if (!modalItem._payload) {
    const res = await fetch('/api/preview?id=' + encodeURIComponent(modalItem.id));
    const { item } = await res.json();
    modalItem._payload = item.payload;
  }
  const payload = modalItem._payload;
  const frames = payload.frames || [];
  const size = payload.v === 4 ? 13 : 25;
  const canvas = document.getElementById('modalCanvas');
  const rows = size === 13 ? ROWS_13 : ROWS_25;
  let frame = 0;

  if (modalTimer) cancelAnimationFrame(modalTimer);
  let last = 0;
  const dur = (frames[0] && Number(frames[0].d) > 0) ? Number(frames[0].d) : 100;
  function step(ts) {
    if (!playing) { modalTimer = requestAnimationFrame(step); return; }
    if (!last || ts - last >= dur) {
      const f = frames[frame];
      if (f) {
        const p = Array.isArray(f.p) ? f.p : [];
        const ctx = canvas.getContext('2d');
        drawGlyphFrame(ctx, size, rows, p, canvas.width, canvas.height);
      }
      frame = (frame + 1) % frames.length;
      last = ts;
    }
    modalTimer = requestAnimationFrame(step);
  }
  step(0);
}

function formatTrigger(t) {
  if (!t || typeof t !== 'object') return '—';
  const type = t.type || 'unknown';
  if (type === 'time' && t.at) return `Daily at ${esc(t.at)}${t.tz ? ' (' + esc(t.tz) + ')' : ''}`;
  if (type === 'time_window' && t.startLocal && t.endLocal) return `Between ${esc(t.startLocal)} and ${esc(t.endLocal)}${t.tz ? ' (' + esc(t.tz) + ')' : ''}`;
  return `${esc(type)}${t.at ? ' at ' + esc(t.at) : ''}`;
}

function formatAction(a) {
  if (!a || typeof a !== 'object') return '—';
  const type = (a.type || 'action').replace(/_/g, ' ');
  const extra = Object.entries(a)
    .filter(([k]) => k !== 'type')
    .map(([k, v]) => `${esc(k.replace(/_/g, ' '))}: ${esc(String(v))}`)
    .join(', ');
  return esc(type) + (extra ? ` — ${extra}` : '');
}

function formatCondition(c) {
  if (!c || typeof c !== 'object') return '—';
  const type = (c.type || 'condition').replace(/_/g, ' ');
  const extra = Object.entries(c)
    .filter(([k]) => k !== 'type')
    .map(([k, v]) => `${esc(k.replace(/_/g, ' '))}: ${esc(String(v))}`)
    .join(', ');
  return esc(type) + (extra ? ` — ${extra}` : '');
}

function renderTemplateModal(it, payload) {
  const wrap = document.getElementById('modalIconWrap');
  const symbol = iconMap.get(it.preview?.icon) || iconMap.get(iconFallback) || 'star';
  const bg = it.preview?.iconBackground === 'transparent' ? 'var(--panel2)' : esc(it.preview?.iconBackground || 'var(--panel2)');
  wrap.style.background = bg;
  wrap.innerHTML = `<span class="material-symbols-outlined">${esc(symbol)}</span>`;

  document.getElementById('modalTemplateType').textContent = (it.type === 'template' ? 'MODE / ROUTINE' : it.type).toUpperCase();
  document.getElementById('modalTemplateAuthor').textContent = `by @${esc(it.handle)}`;

  const automations = Array.isArray(payload?.automations) ? payload.automations : [];
  const caps = Array.isArray(it.capabilities) ? it.capabilities : [];
  const body = document.getElementById('modalTemplateDetail');
  body.innerHTML = '';

  if (automations.length > 0) {
    for (const a of automations) {
      const trigger = a.trigger || {};
      const conditions = Array.isArray(a.conditions) ? a.conditions : [];
      const actions = Array.isArray(a.actions) ? a.actions : [];
      const title = automations.length > 1 ? `<div class="section-title">${esc(a.name || 'Automation')}</div>` : '';
      const when = formatTrigger(trigger);
      const conds = conditions.length ? conditions.map(formatCondition).map(c => `<div class="item">${c}</div>`).join('') : '<div class="empty-list">none</div>';
      const then = actions.length ? actions.map(formatAction).map(c => `<div class="item">${c}</div>`).join('') : '<div class="empty-list">no actions</div>';
      const div = document.createElement('div');
      div.className = 'section';
      div.innerHTML = `${title}
        <div class="section-title">When</div>
        <div class="section-body">${when}</div>
        <div class="section-title">Only if</div>
        <div class="section-body">${conds}</div>
        <div class="section-title">Then</div>
        <div class="section-body">${then}</div>`;
      body.appendChild(div);
    }
  } else {
    body.innerHTML = '<div class="section"><div class="section-body empty-list">No automation details in payload.</div></div>';
  }

  if (caps.length) {
    const div = document.createElement('div');
    div.className = 'section';
    div.innerHTML = `<div class="section-title">Requires</div><div class="section-body">${caps.map(c => `<span class="tag">${esc(c)}</span>`).join(' ')}</div>`;
    body.appendChild(div);
  }
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playBtn').textContent = playing ? 'PAUSE' : 'PLAY';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  if (modalTimer) cancelAnimationFrame(modalTimer);
  modalTimer = null;
  modalItem = null;
}

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

if (adminToken) document.getElementById('adminChip').style.display = '';
loadIcons().then(load);
</script>
</body>
