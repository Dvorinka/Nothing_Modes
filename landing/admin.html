<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nothing Modes — Crash Reports</title>
<style>
  @font-face { font-family:"Doto"; src:url("fonts/doto.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Geist Mono"; src:url("fonts/geist_mono_regular.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Geist Sans"; src:url("fonts/geist_sans_regular.ttf") format("truetype"); font-display:swap; }
  :root {
    --bg:#000; --panel:#161616; --panel2:#0f0f0f; --line:#262626; --fg:#fafaf8;
    --dim:#8a8a8a; --red:#D71921; --amber:#e0a030;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 "Geist Sans",system-ui,sans-serif; }
  code, pre, .mono { font-family:"Geist Mono",ui-monospace,Menlo,monospace; }

  /* ── auth ── */
  #auth { max-width:22rem; margin:24vh auto 0; text-align:center; }
  #auth .brand { font-family:"Doto",monospace; font-size:1.5rem; letter-spacing:.2em; margin-bottom:2rem; }
  #auth input { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--fg);
    padding:.7rem .9rem; border-radius:.5rem; font:inherit; margin-bottom:.8rem; text-align:center; }
  #auth input:focus { outline:none; border-color:var(--red); }
  .btn { background:var(--red); color:#fff; border:0; padding:.6rem 1.4rem;
    border-radius:.5rem; font:inherit; font-weight:600; cursor:pointer; letter-spacing:.05em; }
  .btn.ghost { background:none; border:1px solid var(--line); color:var(--dim); font-weight:400; }
  .btn.ghost:hover { color:var(--fg); border-color:#444; }
  #autherr { color:var(--red); margin-top:.8rem; min-height:1.2em; font-size:.85rem; }

  /* ── app shell ── */
  #app { display:none; max-width:60rem; margin:0 auto; padding:2rem 1.25rem 4rem; }
  .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1.6rem; }
  .top h1 { font-family:"Doto",monospace; font-size:1.3rem; letter-spacing:.18em; }
  .top h1 em { font-style:normal; color:var(--red); }

  /* ── stats ── */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.7rem; margin-bottom:1.6rem; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:.6rem; padding:.9rem 1.1rem; }
  .stat .num { font-family:"Doto",monospace; font-size:1.6rem; color:var(--fg); }
  .stat .num.red { color:var(--red); }
  .stat .lbl { color:var(--dim); font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; margin-top:.15rem; }

  /* ── filters ── */
  .filters { display:flex; gap:.6rem; margin-bottom:1.4rem; flex-wrap:wrap; }
  .filters input { flex:1; min-width:200px; background:var(--panel); border:1px solid var(--line);
    color:var(--fg); padding:.55rem .9rem; border-radius:.5rem; font:inherit; }
  .filters input:focus { outline:none; border-color:#444; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--dim); padding:.55rem 1rem;
    border-radius:.5rem; font:inherit; cursor:pointer; font-size:.82rem; }
  .chip.on { border-color:var(--red); color:var(--fg); }
  .chip .dot { display:inline-block; width:.5rem; height:.5rem; border-radius:50%; margin-right:.4rem; vertical-align:1px; }

  /* ── group cards ── */
  .group { background:var(--panel); border:1px solid var(--line); border-radius:.7rem;
    margin-bottom:.8rem; overflow:hidden; }
  .group-head { padding:1rem 1.2rem; cursor:pointer; display:flex; gap:1rem; align-items:flex-start; }
  .group-head:hover { background:#1a1a1a; }
  .badge { flex-shrink:0; font-size:.62rem; font-weight:700; letter-spacing:.12em; padding:.25rem .6rem;
    border-radius:99px; text-transform:uppercase; margin-top:.15rem; }
  .badge.crash { background:rgba(215,25,33,.15); color:var(--red); border:1px solid rgba(215,25,33,.4); }
  .badge.error { background:rgba(224,160,48,.1); color:var(--amber); border:1px solid rgba(224,160,48,.35); }
  .group-body { flex:1; min-width:0; }
  .sig { font-family:"Geist Mono",monospace; font-weight:600; font-size:.9rem; word-break:break-all; }
  .msg { color:var(--dim); font-size:.82rem; margin-top:.25rem; word-break:break-all; }
  .meta { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.6rem; }
  .tag { background:var(--panel2); border:1px solid var(--line); border-radius:.4rem;
    padding:.18rem .55rem; font-size:.7rem; color:var(--dim); font-family:"Geist Mono",monospace; }
  .count { flex-shrink:0; font-family:"Doto",monospace; font-size:1.4rem; color:var(--dim); min-width:2.6rem; text-align:right; }
  .count.many { color:var(--red); }
  .arrow { flex-shrink:0; color:var(--dim); transition:transform .15s; font-size:.8rem; margin-top:.3rem; }
  .group.open .arrow { transform:rotate(90deg); }

  .reports { display:none; border-top:1px solid var(--line); }
  .group.open .reports { display:block; }
  .rep { padding:.9rem 1.2rem; border-top:1px solid #1e1e1e; }
  .rep:first-child { border-top:0; }
  .rep .stamp { color:var(--dim); font-size:.72rem; font-family:"Geist Mono",monospace; margin-bottom:.5rem; }
  .rep .stamp b { color:var(--fg); font-weight:500; }
  pre { background:var(--panel2); border:1px solid var(--line); border-radius:.45rem; padding:.8rem;
    overflow-x:auto; font-size:.72rem; line-height:1.55; white-space:pre-wrap; word-break:break-all; color:#bbb; }

  #status { color:var(--dim); margin-bottom:1rem; font-size:.85rem; min-height:1.2em; }
  .empty { color:var(--dim); text-align:center; padding:3rem 0; font-family:"Geist Mono",monospace; font-size:.85rem; }
</style>
</head>
<body>

<div id="auth">
  <div class="brand">NOTHING&nbsp;MODES</div>
  <input id="token" type="password" placeholder="admin token" autocomplete="off">
  <button class="btn" onclick="saveToken()">SIGN IN</button>
  <p id="autherr"></p>
</div>

<div id="app">
  <div class="top">
    <h1>NOTHING MODES <em>/</em> CRASH REPORTS</h1>
    <button class="btn ghost" onclick="logout()">Sign out</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <input id="q" type="search" placeholder="Filter by exception, message, device, version…">
    <button class="chip on" data-kind="all">All</button>
    <button class="chip" data-kind="crash"><span class="dot" style="background:var(--red)"></span>Crashes</button>
    <button class="chip" data-kind="error"><span class="dot" style="background:var(--amber)"></span>Errors</button>
  </div>
  <div id="status">Loading…</div>
  <div id="list"></div>
</div>

<script>
const tokenEl = document.getElementById('token');
const qEl = document.getElementById('q');
let allReports = [];
let kindFilter = 'all';

tokenEl.value = localStorage.getItem('crash_admin_token') || '';
if (tokenEl.value) load();

function saveToken() {
  localStorage.setItem('crash_admin_token', tokenEl.value.trim());
  load();
}
function logout() {
  localStorage.removeItem('crash_admin_token');
  location.reload();
}
tokenEl.addEventListener('keydown', e => { if (e.key === 'Enter') saveToken(); });
qEl.addEventListener('input', render);
document.querySelectorAll('.chip').forEach(c =>
  c.addEventListener('click', () => {
    kindFilter = c.dataset.kind;
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    render();
  }));

async function load() {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const res = await fetch('/api/crashes', {
    headers: { Authorization: 'Bearer ' + localStorage.getItem('crash_admin_token') }
  });
  if (res.status === 401) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth').style.display = 'block';
    document.getElementById('autherr').textContent = 'Invalid token.';
    return;
  }
  const { reports } = await res.json();
  allReports = reports || [];
  render();
}

function ago(ts) {
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function render() {
  const q = qEl.value.toLowerCase();
  const reports = allReports.filter(r => {
    if (kindFilter !== 'all' && (r.kind || 'crash') !== kindFilter) return false;
    if (!q) return true;
    return [r.exception_class, r.message, r.device, r.app_version, r.flavor, r.context]
      .some(v => String(v || '').toLowerCase().includes(q));
  });

  // stats over unfiltered set
  const day = Date.now() - 86400000;
  const sigs = new Set(allReports.map(r => (r.exception_class || '') + '|' + (r.message || '')));
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${allReports.length}</div><div class="lbl">Reports</div></div>
    <div class="stat"><div class="num red">${allReports.filter(r => (r.kind || 'crash') === 'crash').length}</div><div class="lbl">Crashes</div></div>
    <div class="stat"><div class="num">${allReports.filter(r => r.kind === 'error').length}</div><div class="lbl">Errors</div></div>
    <div class="stat"><div class="num">${sigs.size}</div><div class="lbl">Unique</div></div>
    <div class="stat"><div class="num">${allReports.filter(r => new Date(r.created_at) > day).length}</div><div class="lbl">Last 24h</div></div>
    <div class="stat"><div class="num" style="font-size:1.1rem;padding-top:.4rem">${allReports[0] ? ago(allReports[0].created_at) : '—'}</div><div class="lbl">Latest</div></div>`;

  const groups = new Map();
  for (const r of reports) {
    const sig = (r.exception_class || 'Unknown') + '|' + (r.message || '');
    (groups.get(sig) || groups.set(sig, []).get(sig)).push(r);
  }

  document.getElementById('status').textContent =
    q || kindFilter !== 'all' ? `${reports.length} of ${allReports.length} reports` : '';

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!reports.length) {
    list.innerHTML = '<div class="empty">NO REPORTS · ALL QUIET</div>';
    return;
  }
  for (const [sig, rs] of [...groups.entries()].sort(
    (a, b) => new Date(b[1][0].created_at) - new Date(a[1][0].created_at))) {
    const [cls, msg] = sig.split('|');
    const latest = rs[0];
    const kind = latest.kind || 'crash';
    const versions = [...new Set(rs.map(r => r.app_version))].join(', ');
    const devices = [...new Set(rs.map(r => r.device))].join(' · ');
    const el = document.createElement('div');
    el.className = 'group';
    el.onclick = e => { if (!e.target.closest('pre')) el.classList.toggle('open'); };
    el.innerHTML = `
      <div class="group-head">
        <span class="badge ${kind}">${kind}</span>
        <div class="group-body">
          <div class="sig">${esc(cls)}</div>
          <div class="msg">${esc(msg || '(no message)')}</div>
          <div class="meta">
            <span class="tag">v${esc(versions)}</span>
            <span class="tag">${esc(latest.flavor)}</span>
            <span class="tag">${esc(devices)}</span>
            <span class="tag">${ago(latest.created_at)}</span>
          </div>
        </div>
        <span class="count ${rs.length > 1 ? 'many' : ''}">×${rs.length}</span>
        <span class="arrow">▶</span>
      </div>
      <div class="reports">${rs.map(r => `
        <div class="rep">
          <div class="stamp"><b>${new Date(r.created_at).toLocaleString()}</b> ·
            ${esc(r.device)} · Android ${esc(r.android_release)} (SDK ${r.sdk_int}) ·
            v${esc(r.app_version)} (${r.version_code}) ${esc(r.flavor)} ·
            thread ${esc(r.thread)}${r.context ? ' · ' + esc(r.context) : ''}</div>
          <pre>${esc(r.stacktrace)}</pre>
        </div>`).join('')}
      </div>`;
    list.appendChild(el);
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
