<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing Modes - Screenshots</title>
<style>
  :root { --bg:#0a0a0a; --card:#141414; --line:#2a2a2a; --txt:#f2f2f2; --dim:#9a9a9a; --red:#ff3030; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:"Courier New",monospace; padding:48px 24px; }
  h1 { font-weight:400; letter-spacing:.35em; text-transform:uppercase; font-size:14px; color:var(--dim); text-align:center; }
  h1 b { color:var(--red); font-weight:400; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:32px; max-width:1400px; margin:48px auto 0; }
  figure { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; }
  img { width:100%; border-radius:12px; display:block; }
  figcaption { margin-top:14px; font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--dim); text-align:center; }
</style>
</head>
<body>
  <h1>Nothing<b>.</b>Modes &mdash; screenshot set</h1>
  <div class="grid">
    <figure><img src="screenshots/home.png" alt="Automation list"><figcaption>01 / Automation list</figcaption></figure>
    <figure><img src="screenshots/detail.png" alt="Mode detail"><figcaption>02 / Mode detail</figcaption></figure>
    <figure><img src="screenshots/builder.png" alt="Routine builder"><figcaption>03 / Routine builder</figcaption></figure>
    <figure><img src="screenshots/catalog.png" alt="Action catalog"><figcaption>04 / Action catalog</figcaption></figure>
  </div>
</body>
</html>
