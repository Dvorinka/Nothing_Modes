name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.NOTHING_MODES_KEYSTORE_BASE64 }}" | base64 -d > $HOME/nothing-modes-release.jks
          echo "NOTHING_MODES_KEYSTORE=$HOME/nothing-modes-release.jks" >> $GITHUB_ENV

      - name: Build signed release APK + Play AAB
        run: ./gradlew assembleGithubRelease bundlePlayRelease --no-daemon --parallel --build-cache --stacktrace
        env:
          NOTHING_MODES_KEYSTORE: ${{ env.NOTHING_MODES_KEYSTORE }}
          NOTHING_MODES_KEYSTORE_PASSWORD: ${{ secrets.NOTHING_MODES_KEYSTORE_PASSWORD }}
          NOTHING_MODES_KEY_ALIAS: ${{ secrets.NOTHING_MODES_KEY_ALIAS }}
          NOTHING_MODES_KEY_PASSWORD: ${{ secrets.NOTHING_MODES_KEY_PASSWORD }}

      - name: Rename APK + AAB + mappings
        id: apk
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/github/release/app-github-release.apk "nothing-modes-v${VERSION}.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "nothing-modes-play-v${VERSION}.aab"
          cp app/build/outputs/mapping/playRelease/mapping.txt "nothing-modes-play-mapping-v${VERSION}.txt"
          cp app/build/outputs/mapping/githubRelease/mapping.txt "nothing-modes-github-mapping-v${VERSION}.txt"
          echo "path=nothing-modes-v${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "aab_path=nothing-modes-play-v${VERSION}.aab" >> $GITHUB_OUTPUT
          echo "play_mapping=nothing-modes-play-mapping-v${VERSION}.txt" >> $GITHUB_OUTPUT
          echo "github_mapping=nothing-modes-github-mapping-v${VERSION}.txt" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.aab_path }}
            ${{ steps.apk.outputs.play_mapping }}
            ${{ steps.apk.outputs.github_mapping }}
          draft: false
          generate_release_notes: true

      - name: Install gplay
        run: |
          curl -L -o /tmp/gplay \
            https://github.com/tamtom/play-console-cli/releases/download/v0.10.0/gplay-linux-amd64
          chmod +x /tmp/gplay

      - name: Publish to Play closed testing (alpha) track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Secrets must go through env:, not inline expression syntax - quoted JSON breaks interpolation.
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > /tmp/play-account.json
          /tmp/gplay auth login --service-account /tmp/play-account.json
          VC=$(grep -E '^\s+versionCode\s*=' app/build.gradle.kts | sed 's/.*=\s*//' | tr -d ' ')
          # Deobfuscation files must upload in the SAME edit as the bundle, before
          # commit - `gplay release` commits its own edit internally and Play then
          # rejects late mapping uploads, so drive the edit sequence manually.
          EDIT_ID=$(/tmp/gplay edits create --package com.tdvorak.nothingmodes | jq -r '.id // .editId')
          /tmp/gplay bundles upload --package com.tdvorak.nothingmodes \
            --edit "$EDIT_ID" \
            --file app/build/outputs/bundle/playRelease/app-play-release.aab
          /tmp/gplay deobfuscation upload --package com.tdvorak.nothingmodes \
            --edit "$EDIT_ID" \
            --apk-version "$VC" \
            --file app/build/outputs/mapping/playRelease/mapping.txt
          jq -Rn --arg vc "$VC" --arg t "$(cat "fastlane/metadata/android/en-US/changelogs/${VC}.txt")" \
            '[{status:"completed",versionCodes:[$vc],releaseNotes:[{language:"en-US",text:$t}]}]' \
            > /tmp/play-release.json
          /tmp/gplay tracks update --package com.tdvorak.nothingmodes \
            --edit "$EDIT_ID" --track alpha --releases @/tmp/play-release.json
          /tmp/gplay edits commit --package com.tdvorak.nothingmodes --edit "$EDIT_ID"
