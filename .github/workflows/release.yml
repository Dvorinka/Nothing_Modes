name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.NOTHING_MODES_KEYSTORE_BASE64 }}" | base64 -d > $HOME/nothing-modes-release.jks
          echo "NOTHING_MODES_KEYSTORE=$HOME/nothing-modes-release.jks" >> $GITHUB_ENV

      - name: Build signed release APK + Play AAB
        run: ./gradlew assembleGithubRelease bundlePlayRelease --no-daemon --parallel --build-cache --stacktrace
        env:
          NOTHING_MODES_KEYSTORE: ${{ env.NOTHING_MODES_KEYSTORE }}
          NOTHING_MODES_KEYSTORE_PASSWORD: ${{ secrets.NOTHING_MODES_KEYSTORE_PASSWORD }}
          NOTHING_MODES_KEY_ALIAS: ${{ secrets.NOTHING_MODES_KEY_ALIAS }}
          NOTHING_MODES_KEY_PASSWORD: ${{ secrets.NOTHING_MODES_KEY_PASSWORD }}

      - name: Rename APK + AAB
        id: apk
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/github/release/app-github-release.apk "nothing-modes-v${VERSION}.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "nothing-modes-play-v${VERSION}.aab"
          echo "path=nothing-modes-v${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "aab_path=nothing-modes-play-v${VERSION}.aab" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.aab_path }}
          draft: false
          generate_release_notes: true

      - name: Install gplay
        run: |
          curl -L -o /tmp/gplay \
            https://github.com/tamtom/play-console-cli/releases/download/v0.10.0/gplay-linux-amd64
          chmod +x /tmp/gplay

      - name: Publish to Play internal track
        run: |
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" > /tmp/play-account.json
          /tmp/gplay auth login --service-account /tmp/play-account.json
          VC=$(grep -E '^\s+versionCode\s*=' app/build.gradle.kts | sed 's/.*=\s*//' | tr -d ' ')
          jq -Rn --arg t "$(cat "fastlane/metadata/android/en-US/changelogs/${VC}.txt")" \
            '[{language:"en-US",text:$t}]' > /tmp/play-notes.json
          /tmp/gplay release --package com.tdvorak.nothingmodes \
            --track internal \
            --bundle app/build/outputs/bundle/playRelease/app-play-release.aab \
            --release-notes @/tmp/play-notes.json
