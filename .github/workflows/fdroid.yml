name: F-Droid index

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 0.12.0)'
        required: true
      version_code:
        description: 'Version code (e.g. 13)'
        required: true

permissions:
  contents: write

jobs:
  fdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install fdroidserver
        run: |
          python3 -m venv /tmp/fdroid-venv
          /tmp/fdroid-venv/bin/pip install fdroidserver

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0'

      - name: Generate F-Droid index
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$(grep -E '^\s+versionCode\s*=' app/build.gradle.kts | sed 's/.*=\s*//' | tr -d ' ')
          fi
          PATH="/tmp/fdroid-venv/bin:$PATH" ./landing/fdroid/scripts/fdroid-release.sh "$VERSION" "$VERSION_CODE"

      - name: Zip F-Droid repo
        run: |
          cd landing/fdroid
          zip -r fdroid-repo.zip repo

      - name: Upload F-Droid repo to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: landing/fdroid/fdroid-repo.zip
          fail_on_unmatched_files: false

      - name: Upload F-Droid repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-repo
          path: landing/fdroid/repo/**
